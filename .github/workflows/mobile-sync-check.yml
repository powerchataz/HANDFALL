name: Mobile wrapper sync check

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "icon-512.png"
      - "apple-touch-icon.png"
      - "mobile/**"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "icon-512.png"
      - "apple-touch-icon.png"
      - "mobile/**"

jobs:
  sync-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync game files into www/
        run: npm run sync-web

      - name: Sync into native projects (no native SDKs required for this step)
        run: npx cap sync
